name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          set -e
          mkdir -p _site
          shopt -s nullglob
          archives=( *.zip )
          if [ ${#archives[@]} -gt 0 ]; then
            mkdir -p /tmp/site-unpack
            for archive in "${archives[@]}"; do
              unzip -oq "$archive" -d /tmp/site-unpack
            done
            index_file="$(find /tmp/site-unpack -type f -name index.html -print -quit)"
            if [ -n "$index_file" ]; then
              site_dir="$(dirname "$index_file")"
              cp -R "$site_dir"/. _site/
            fi
          fi
          if [ ! -f _site/index.html ]; then
            if [ -f index.html ]; then
              cp -R . _site/
              rm -rf _site/.git _site/.github _site/_site
            else
              echo "ERROR: index.html was not found in the repository or its ZIP archive."
              exit 1
            fi
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
